services:
  priamoryki-bot:
    build: ./
    container_name: priamoryki-bot
    environment:
      TOKEN: ${TOKEN}
      BOT_AUTHOR_ID: ${BOT_AUTHOR_ID}
      YADISK_TOKEN: ${YADISK_TOKEN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      YT_CIPHER_URL: http://yt-cipher:8001
      YT_CIPHER_TOKEN: ${YT_CIPHER_TOKEN}
    ports:
      - "1080:1080"
    depends_on:
      - yt-cipher

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS
      API_TOKEN: ${YT_CIPHER_TOKEN}
    restart: unless-stopped
